name: 🚀 Feature Request
description: Suggest a new idea or enhancement for the project.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: input
    id: summary
    attributes:
      label: Feature Summary
      description: Short description of the feature you're requesting.
      placeholder: "Add dark mode to the web UI."
    validations:
      required: false

  - type: textarea
    id: how
    attributes:
      label: How would this feature be implemented?
      description: Describe how the feature would be implemented into the repository.
      placeholder: "Add a UI toggle switch that alters the UI color elements on the web page."
    validations:
      required: false
