name: 🔧 Chore Request
description: Suggest a cleanup or update for the project.
title: "[Chore]: "
labels: [enhancement]
body:
  - type: input
    id: summary
    attributes:
      label: Chore Summary
      description: Short description of the chore you're requesting.
      placeholder: "Update the UI."
    validations:
      required: false

  - type: textarea
    id: motivation
    attributes:
      label: Why is this chore needed?
      description: Describe the necessity to update. Why do you need this update?
      placeholder: "The UI is old and outdated."
    validations:
      required: false
